name: Android Port CI & Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'

      - name: Install Web Dependencies
        run: |
          cd redalert2
          bun install --frozen-lockfile

      - name: Run Bun Unit Tests
        run: |
          cd redalert2
          bun test

      - name: Install Playwright Browsers
        run: |
          cd redalert2
          bunx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests (Headless)
        run: |
          cd redalert2
          bunx playwright test --config e2e/playwright.config.ts

      - name: Build Web App (Vite Dist)
        run: |
          cd redalert2
          bun --bun vite build

      - name: Stage WebDist to Android Assets
        run: |
          rm -rf android/app/src/main/assets/WebDist
          mkdir -p android/app/src/main/assets
          cp -R redalert2/dist android/app/src/main/assets/WebDist
          rm -rf android/app/src/main/assets/WebDist/local-pack

      - name: Run Static Forbidden Asset & Security Scanner
        run: |
          chmod +x scripts/verify-no-retail-assets.sh
          ./scripts/verify-no-retail-assets.sh

      - name: Run Android Gradle Unit Tests
        run: |
          cd android
          ./gradlew testPublicCiDebugUnitTest

      - name: Assemble Public CI Debug APK
        run: |
          cd android
          ./gradlew assemblePublicCiDebug

      - name: Inspect Compiled APK Asset Contents
        run: |
          APK_PATH="android/app/build/outputs/apk/publicCi/debug/app-publicCi-debug.apk"
          chmod +x scripts/verify-no-retail-assets.sh
          ./scripts/verify-no-retail-assets.sh "$APK_PATH"

      - name: Upload Public CI APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-publicCi-debug
          path: android/app/build/outputs/apk/publicCi/debug/app-publicCi-debug.apk
